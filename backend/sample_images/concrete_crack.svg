<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Concrete surface texture background -->
  <rect width="800" height="600" fill="#cbd5e1" />
  
  <!-- Aggregate flecks / concrete mottling -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="120" cy="80" r="12" />
    <circle cx="340" cy="140" r="18" />
    <circle cx="210" cy="450" r="15" />
    <circle cx="680" cy="220" r="22" />
    <circle cx="560" cy="510" r="16" />
    <circle cx="140" cy="320" r="9" />
    <circle cx="720" cy="420" r="14" />
  </g>
  
  <!-- Vertical construction joint line -->
  <line x1="180" y1="40" x2="180" y2="560" stroke="#64748b" stroke-width="6" />
  <text x="190" y="550" font-family="sans-serif" font-size="11" fill="#475569">Construction Cold Joint</text>

  <!-- Main Diagonal Shear Crack Path -->
  <path d="M 210,130 Q 250,170 290,200 T 360,250 T 420,320 T 490,370 T 560,430 T 630,490" 
        fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Hairline secondary branch cracks -->
  <path d="M 360,250 Q 400,230 430,240" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <path d="M 490,370 Q 520,350 550,360" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 290,200 Q 300,160 320,150" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  
  <!-- Optical Tell-Tale / Reference Coin Marker -->
  <g transform="translate(620, 380)">
    <circle cx="40" cy="40" r="35" fill="#f59e0b" stroke="#b45309" stroke-width="3" />
    <circle cx="40" cy="40" r="30" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2" />
    <text x="18" y="38" font-family="sans-serif" font-size="10" font-weight="bold" fill="#78350f">SCALE REF</text>
    <text x="18" y="52" font-family="sans-serif" font-size="9" fill="#78350f">Dia: 25.0 mm</text>
  </g>

  <!-- Crack Width Indicator callout -->
  <g transform="translate(380, 290)">
    <line x1="0" y1="0" x2="80" y2="-60" stroke="#dc2626" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#dc2626" />
    <rect x="80" y="-85" width="160" height="40" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <text x="90" y="-68" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">ESTIMATED WIDTH</text>
    <text x="90" y="-52" font-family="sans-serif" font-size="11" fill="#1e293b">Approx 1.8mm - 2.5mm</text>
  </g>

  <!-- Disclaimer Footer Badge -->
  <rect x="40" y="520" width="550" height="40" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" />
  <text x="55" y="544" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">
    ⚠ VISUAL INDICATION ONLY. PROFESSIONAL STRUCTURAL INSPECTION RECOMMENDED.
  </text>

  <!-- Header Banner -->
  <rect x="40" y="30" width="720" height="45" rx="6" fill="#1e293b" />
  <text x="60" y="58" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">STRUCTURAL DEFECT AUDIT | COLUMN-BEAM DIAGONAL SHEAR CRACK</text>
</svg>

