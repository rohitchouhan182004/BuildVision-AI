<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#e2e8f0" />
  <!-- Sky background -->
  <rect width="800" height="280" fill="#bae6fd" />
  <!-- Concrete Slab 5th floor -->
  <rect x="50" y="240" width="700" height="340" fill="#94a3b8" stroke="#475569" stroke-width="4" />
  <rect x="50" y="240" width="700" height="30" fill="#64748b" />
  
  <!-- Scaffolding Frame System -->
  <g stroke="#334155" stroke-width="6">
    <line x1="120" y1="120" x2="120" y2="580" />
    <line x1="280" y1="120" x2="280" y2="580" />
    <line x1="440" y1="120" x2="440" y2="580" />
    <line x1="600" y1="120" x2="600" y2="580" />
    
    <!-- Ledger horizontal bars -->
    <line x1="80" y1="150" x2="640" y2="150" stroke-width="5" />
    <line x1="80" y1="270" x2="640" y2="270" stroke-width="5" />
    <line x1="80" y1="390" x2="640" y2="390" stroke-width="5" />
    <line x1="80" y1="510" x2="640" y2="510" stroke-width="5" />
  </g>
  
  <!-- Scaffolding Cross Bracing -->
  <g stroke="#64748b" stroke-width="3" stroke-dasharray="8,4">
    <line x1="120" y1="150" x2="280" y2="270" />
    <line x1="280" y1="150" x2="120" y2="270" />
    <line x1="280" y1="270" x2="440" y2="390" />
    <line x1="440" y1="270" x2="280" y2="390" />
    <line x1="440" y1="150" x2="600" y2="270" />
    <line x1="600" y1="150" x2="440" y2="270" />
  </g>
  
  <!-- Exposed Unbarricaded Floor Edge (Violation Area) -->
  <rect x="630" y="235" width="130" height="15" fill="#ef4444" opacity="0.8" />
  <text x="640" y="225" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">UNPROTECTED EDGE</text>

  <!-- Worker 1 without Helmet (Violation) -->
  <g transform="translate(200, 95)">
    <!-- Head without helmet -->
    <circle cx="20" cy="18" r="14" fill="#fbcfe8" stroke="#be185d" stroke-width="2" />
    <!-- Hair -->
    <path d="M 8 16 Q 20 4 32 16" fill="#1e293b" />
    <!-- Body in blue shirt -->
    <rect x="8" y="32" width="24" height="42" fill="#2563eb" rx="4" />
    <!-- Missing Harness indicator -->
    <circle cx="20" cy="50" r="18" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="4,2" />
  </g>
  <text x="145" y="85" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">NO HELMET / HARNESS</text>
  <line x1="220" y1="90" x2="220" y2="105" stroke="#dc2626" stroke-width="2" />

  <!-- Worker 2 with Helmet & Vest (Compliant) -->
  <g transform="translate(480, 95)">
    <!-- Yellow Helmet -->
    <ellipse cx="20" cy="12" rx="16" ry="10" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <circle cx="20" cy="20" r="12" fill="#fed7aa" />
    <!-- Orange High-Vis Vest -->
    <rect x="8" y="32" width="24" height="42" fill="#f97316" rx="4" />
    <!-- Silver reflective stripes -->
    <rect x="12" y="36" width="4" height="34" fill="#f1f5f9" />
    <rect x="24" y="36" width="4" height="34" fill="#f1f5f9" />
  </g>
  <text x="460" y="85" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">PPE COMPLIANT</text>

  <!-- Header Banner -->
  <rect x="30" y="25" width="740" height="45" rx="6" fill="#0f172a" />
  <text x="50" y="53" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">SITE SAFETY AUDIT | TOWER 1 - ELEVATED SLAB PERIMETER</text>
  <rect x="640" y="35" width="115" height="25" rx="4" fill="#dc2626" />
  <text x="652" y="52" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">HIGH RISK: 78/100</text>
</svg>

