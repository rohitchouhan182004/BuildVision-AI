<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#f1f5f9" />
  <!-- Clear Sky -->
  <rect width="800" height="320" fill="#e0f2fe" />
  <!-- Earth / Excavated subgrade -->
  <rect x="0" y="440" width="800" height="160" fill="#78350f" opacity="0.8" />
  <rect x="0" y="420" width="800" height="40" fill="#a16207" opacity="0.6" />

  <!-- Concrete Building Structure (Columns & Slabs) -->
  <g fill="#94a3b8" stroke="#475569" stroke-width="3">
    <!-- Ground slab -->
    <rect x="180" y="400" width="560" height="25" />
    <!-- 1st floor columns -->
    <rect x="220" y="290" width="30" height="110" />
    <rect x="360" y="290" width="30" height="110" />
    <rect x="500" y="290" width="30" height="110" />
    <rect x="640" y="290" width="30" height="110" />
    <!-- 1st floor slab -->
    <rect x="180" y="270" width="560" height="20" />
    <!-- 2nd floor columns with shuttering -->
    <rect x="220" y="160" width="30" height="110" fill="#b45309" stroke="#78350f" />
    <rect x="360" y="160" width="30" height="110" fill="#b45309" stroke="#78350f" />
    <rect x="500" y="160" width="30" height="110" />
    <rect x="640" y="160" width="30" height="110" />
    <!-- Shuttering deck on top -->
    <rect x="180" y="145" width="560" height="15" fill="#d97706" />
  </g>

  <!-- Rebar Mesh on deck -->
  <g stroke="#334155" stroke-width="2">
    <line x1="200" y1="140" x2="720" y2="140" />
    <line x1="200" y1="135" x2="720" y2="135" />
    <line x1="240" y1="120" x2="240" y2="145" />
    <line x1="380" y1="120" x2="380" y2="145" />
    <line x1="520" y1="120" x2="520" y2="145" />
    <line x1="660" y1="120" x2="660" y2="145" />
  </g>

  <!-- Tower Crane (Yellow) -->
  <g stroke="#eab308" stroke-width="6">
    <!-- Mast tower -->
    <line x1="100" y1="80" x2="100" y2="480" stroke-width="12" />
    <!-- Jib arm -->
    <line x1="40" y1="80" x2="420" y2="80" stroke-width="8" />
    <!-- Counterweight -->
    <rect x="30" y="65" width="35" height="30" fill="#475569" stroke="none" />
    <!-- Crane cabin -->
    <rect x="85" y="90" width="25" height="25" fill="#3b82f6" stroke="none" />
    <!-- Hoist rope & concrete bucket -->
    <line x1="320" y1="80" x2="320" y2="180" stroke="#1e293b" stroke-width="2" />
    <polygon points="310,180 330,180 325,205 315,205" fill="#ef4444" stroke="#b91c1c" stroke-width="1" />
  </g>

  <!-- Header Banner -->
  <rect x="40" y="25" width="720" height="40" rx="6" fill="#0f172a" />
  <text x="60" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">GENERAL SCENE ANALYSIS | RCC SUPERSTRUCTURE & TOWER CRANE HOIST</text>
</svg>
